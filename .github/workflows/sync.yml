name: Auto-Sync LMS Deadlines & Course Material Alerts

on:
  schedule:
    # Runs every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync_and_monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LMS Calendar Sync
        env:
          LMS_URL: https://lms.tech.sjp.ac.lk
          LMS_USERNAME: ${{ secrets.LMS_USERNAME }}
          LMS_PASSWORD: ${{ secrets.LMS_PASSWORD }}
          OUTPUT_PATH: dist/deadlines.ics
          TIMEZONE: Asia/Colombo
        run: |
          python sync.py

      - name: Monitor Course Materials & Announcements (Telegram Alerts)
        env:
          LMS_URL: https://lms.tech.sjp.ac.lk
          LMS_USERNAME: ${{ secrets.LMS_USERNAME }}
          LMS_PASSWORD: ${{ secrets.LMS_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_FILE: seen_items.json
        run: |
          python monitor.py

      - name: Commit & Push State Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_items.json
          git commit -m "Update LMS state cache [skip ci]" || echo "No state changes to commit"
          git push origin main || echo "Failed to push state"

      - name: Deploy Calendar Feed to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false
          commit_message: "Automated deadline calendar update [skip ci]"
